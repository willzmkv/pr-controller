name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libsdl2-dev libsdl2-2.0-0 libudev-dev

      - name: Install Python deps
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest --tb=short -v

  lint:
    name: ruff + black
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linters
        run: pip install ruff black

      - name: ruff check
        run: ruff check . || echo "No source yet"

      - name: black check
        run: black --check . || echo "No source yet"
