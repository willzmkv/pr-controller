[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pr-controller"
version = "0.1.0"
description = "Project-R controller daemon: gamepad hotplug, profile resolution and config writers"
requires-python = ">=3.11"
dependencies = [
    "pyudev>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[project.scripts]
pr-controller = "pr_controller.daemon:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/pr_controller"]
